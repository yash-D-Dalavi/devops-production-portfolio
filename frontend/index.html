<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Infrastructure Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { color: #38bdf8; text-align: center; border-bottom: 2px solid #334155; padding-bottom: 15px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 25px; }
        .card { background: #334155; padding: 20px; border-radius: 8px; text-align: center; border: 1px solid #475569; }
        .status { font-weight: bold; color: #4ade80; display: inline-block; margin-top: 10px; }
        .btn { background: #0284c7; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 1rem; margin-top: 15px; }
        .btn:hover { background: #0369a1; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 DevOps Production Cloud Infrastructure</h1>
        <p style="text-align: center; color: #94a3b8;">Multi-Container Deployment Stack with Live Telemetry</p>
        
        <div class="grid">
            <div class="card">
                <h3>Backend API Status</h3>
                <div id="api-status" class="status">Checking...</div>
            </div>
            <div class="card">
                <h3>Database (PostgreSQL)</h3>
                <div class="status">Connected (Port 5432)</div>
            </div>
            <div class="card">
                <h3>Cache Engine (Redis)</h3>
                <div class="status">Operational (Port 6379)</div>
            </div>
        </div>

        <div style="text-align: center;">
            <button class="btn" onclick="checkBackendHealth()">Refresh Infrastructure Health</button>
        </div>
    </div>

    <script>
        async function checkBackendHealth() {
            const statusElem = document.getElementById('api-status');
            try {
                const response = await fetch('/api/health');
                const data = await response.json();
                statusElem.innerText = data.status + ' (' + data.message + ')';
                statusElem.style.color = '#4ade80';
            } catch (err) {
                statusElem.innerText = 'Offline / Connecting via Proxy...';
                statusElem.style.color = '#f87171';
            }
        }
        checkBackendHealth();
    </script>
</body>
</html>
